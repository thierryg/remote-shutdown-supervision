; =============================================================================
; Remote Shutdown - LAN parental control and machine management (master/agent)
; -----------------------------------------------------------------------------
; File    : packaging/config/master.ini
; Purpose : Master settings (restart required); every key can be overridden by RSD__SECTION__KEY
; Author  : Thierry Gayet <thierry.gayet@labworks.fr>
; Project : remote-shutdown (version: VERSION)
; Copyright (c) 2026 Thierry Gayet. SPDX-License-Identifier: 0BSD
; =============================================================================
; Defaults are shown commented out. Runtime parameters (uptime limit, warning, countdown)
; are edited in the web console, not here.

[server]
; web_host = 0.0.0.0
; web_port = 8443
; agent_host = 0.0.0.0
; agent_port = 8444
; discovery_enabled = yes
; discovery_port = 50000
; Extra DNS names / IP addresses of the server certificate, comma separated.
; tls_extra_names = master.home.arpa, 192.168.1.10

[paths]
; data_dir = /var/lib/rsd-master

[security]
; session_minutes = 30
; session_max_hours = 12
; login_max_failures = 5
; login_window_seconds = 300
; keepalive_timeout = 35
; agent_cert_days = 365
; File holding the bearer token of GET /metrics (Prometheus scrape); empty = disabled.
; metrics_token_file = /etc/rsd-master/metrics.token
; server_cert_days = 397

[log]
; log_level = INFO
; log_json = yes
