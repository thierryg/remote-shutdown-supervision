[extend]
useDefault = true

# Known false positives, matched by exact value (never by path: a real secret added to the same
# file must still be caught). Each one is a public test value, not a credential.
[allowlist]
description = "Public test values"
regexTarget = "match"
regexes = [
  # tests/browser/ui_check.py: admin password set on the throwaway master of `make ui-check`.
  '''Une-Phrase-Secrete-2026''',
]
