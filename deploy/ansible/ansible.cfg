[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
# Facts are gathered at every run (no cache): a reinstalled host must never be seen with the
# facts (Python interpreter, distribution) of its previous installation.
gathering = implicit
interpreter_python = auto_silent
host_key_checking = True
# Run the notified handlers even when a later task fails (no missed restart on re-run).
force_handlers = True
retry_files_enabled = False
nocows = True
forks = 5
timeout = 30

[privilege_escalation]
become = True
become_method = ansible.builtin.sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
