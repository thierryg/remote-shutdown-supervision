# Existing sessions (including this Ansible connection) survive a restart of sshd. The unit is
# "ssh" on Debian, Ubuntu and Linux Mint.
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
    daemon_reload: true
