# ufw would fight nftables for the ruleset (Linux Mint ships it): it is removed.
- name: Remove ufw
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Install the ruleset (validated with nft -c before replacing the file)
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0600"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
