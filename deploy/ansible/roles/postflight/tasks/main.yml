# =============================================================================
# Remote Shutdown - LAN parental control and machine management (master/agent)
# -----------------------------------------------------------------------------
# File    : deploy/ansible/roles/postflight/tasks/main.yml
# Purpose : Sanity checks AFTER the deployment: services, ports, TLS, headers, mTLS, login, audit, backup
# Author  : Thierry Gayet <thierry.gayet@labworks.fr>
# Project : remote-shutdown (version: VERSION)
# Copyright (c) 2026 Thierry Gayet. SPDX-License-Identifier: 0BSD
# =============================================================================
# Every check fails the play with an explicit message. Run them alone at any time:
#   ./rsd-deploy.sh postflight

# --- 1. services -----------------------------------------------------------------------------
- name: "[1/8] Services are running and start at boot"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  loop: "{{ postflight_units }}"
  register: postflight_unit
  retries: 10
  delay: 3
  until: postflight_unit.status.ActiveState == 'active'
  failed_when: >-
    postflight_unit.status.ActiveState != 'active'
    or (item != 'ssh.service' and postflight_unit.status.UnitFileState not in ['enabled', 'static', 'alias', 'indirect'])

- name: "[1/8] The installed version is the deployed one"
  ansible.builtin.command: rsd-master version
  register: postflight_version
  changed_when: false
  failed_when: postflight_version.stdout != rsd_version

# --- 2. ports ---------------------------------------------------------------------------------
- name: "[2/8] Console and agent ports are listening"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    timeout: 60
  loop: ["{{ rsd_web_port }}", "{{ rsd_agent_port }}"]

- name: "[2/8] The discovery port is listening"
  ansible.builtin.command: "ss -H -lun 'sport = :{{ rsd_discovery_port }}'"
  register: postflight_udp
  changed_when: false
  failed_when: rsd_discovery_enabled | bool and postflight_udp.stdout | length == 0

# --- 3. TLS of the console ------------------------------------------------------------------------
- name: "[3/8] TLS 1.2 and 1.3 are accepted, TLS 1.1 is refused"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import socket, ssl, sys
        def handshake(version):
            ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
            ctx.check_hostname, ctx.verify_mode = False, ssl.CERT_NONE
            ctx.minimum_version = ctx.maximum_version = version
            try:
                with socket.create_connection(("127.0.0.1", {{ rsd_web_port }}), timeout=5) as raw:
                    with ctx.wrap_socket(raw) as tls:
                        return tls.version()
            except (ssl.SSLError, OSError):
                return None
        V = ssl.TLSVersion
        result = {v.name: handshake(v) for v in (V.TLSv1_2, V.TLSv1_3)}
        try:
            result["TLSv1_1"] = handshake(V.TLSv1_1)
        except ValueError:  # the local OpenSSL cannot even offer TLS 1.1
            result["TLSv1_1"] = None
        print(result)
        sys.exit(0 if result["TLSv1_2"] and result["TLSv1_3"] and not result["TLSv1_1"] else 1)
  changed_when: false

- name: "[3/8] The certificate chains to the master CA (name localhost in the SAN)"
  ansible.builtin.uri:
    url: "https://localhost:{{ rsd_web_port }}/"
    ca_path: /var/lib/rsd-master/pki/ca.crt
    validate_certs: true
  register: postflight_https

# --- 4. security headers ----------------------------------------------------------------------------
# uri returns the headers lowercased with "-" replaced by "_".
- name: "[4/8] Security headers are present"
  ansible.builtin.assert:
    that: item.value in postflight_https[item.key | lower | replace('-', '_')] | default('')
    fail_msg: "Header {{ item.key }} missing or without '{{ item.value }}'."
    quiet: true
  loop: "{{ postflight_headers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "[4/8] robots.txt forbids everything"
  ansible.builtin.uri:
    url: "https://localhost:{{ rsd_web_port }}/robots.txt"
    ca_path: /var/lib/rsd-master/pki/ca.crt
    return_content: true
  register: postflight_robots
  failed_when: "'Disallow: /' not in postflight_robots.content"

# --- 5. mutual TLS of the agent hub ------------------------------------------------------------------
- name: "[5/8] The agent port refuses a client without certificate"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import socket, ssl, sys
        ctx = ssl.create_default_context(cafile="/var/lib/rsd-master/pki/ca.crt")
        ctx.check_hostname = False
        try:
            with socket.create_connection(("127.0.0.1", {{ rsd_agent_port }}), timeout=5) as raw:
                with ctx.wrap_socket(raw) as tls:
                    tls.settimeout(5)
                    data = tls.recv(1024)
        except (ssl.SSLError, ConnectionError, OSError):
            sys.exit(0)
        sys.exit(1 if data else 0)
  changed_when: false

# --- 6. web administrator ----------------------------------------------------------------------------
- name: "[6/8] The default admin/admin login is refused"
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ rsd_web_port }}/api/login"
    method: POST
    body_format: json
    body: { username: "{{ rsd_web_admin }}", password: admin }
    headers: { X-RSD: "1" }
    validate_certs: false
    status_code: [401]
  when: not rsd_allow_default_admin | bool

- name: "[6/8] The configured password opens a normal session"
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ rsd_web_port }}/api/login"
    method: POST
    body_format: json
    body: { username: "{{ rsd_web_admin }}", password: "{{ rsd_admin_password }}" }
    headers: { X-RSD: "1" }
    validate_certs: false
    return_content: true
  register: postflight_login
  failed_when: postflight_login.status != 200 or postflight_login.json.must_change
  no_log: true
  when: rsd_admin_password is defined

# --- 7. audit and backup --------------------------------------------------------------------------------
- name: "[7/8] The audit hash chain is intact"
  ansible.builtin.command: rsd-master verify-audit
  changed_when: false

- name: "[7/8] A backup can be taken (rsd-master-backup.service)"
  ansible.builtin.systemd_service:
    name: rsd-master-backup.service
    state: started
  changed_when: false
  when: rsd_backup_timer | bool

- name: "[7/8] The backup archive exists and is private"
  ansible.builtin.find:
    paths: /var/lib/rsd-master/backups
    patterns: "rsd-master-*.tar.gz"
  register: postflight_backups
  failed_when: >-
    rsd_backup_timer | bool and (postflight_backups.matched == 0
    or (postflight_backups.files | map(attribute='mode') | reject('equalto', '0600') | list | length) > 0)

# --- 8. firewall and summary ---------------------------------------------------------------------------
- name: "[8/8] The firewall table is loaded"
  ansible.builtin.command: nft list table inet rsd_filter
  register: postflight_nft
  changed_when: false
  failed_when: postflight_nft.rc != 0 or (rsd_web_port | string) not in postflight_nft.stdout
  when: rsd_firewall | bool

- name: "[8/8] fail2ban watches SSH and the master"
  ansible.builtin.command: fail2ban-client status
  register: postflight_f2b
  changed_when: false
  failed_when: "'sshd' not in postflight_f2b.stdout or 'rsd-master' not in postflight_f2b.stdout"
  when: rsd_fail2ban | bool

- name: "[8/8] The fail2ban filter matches the master log (admin/admin attempt above)"
  ansible.builtin.command: fail2ban-regex systemd-journal /etc/fail2ban/filter.d/rsd-master.conf
  register: postflight_regex
  changed_when: false
  failed_when: >-
    postflight_regex.stdout is not search('Lines: [0-9]+ lines, [0-9]+ ignored, [1-9][0-9]* matched')
  when: rsd_fail2ban | bool and not rsd_allow_default_admin | bool

- name: Deployment summary
  ansible.builtin.debug:
    msg:
      - "Remote Shutdown master {{ rsd_version }} is up on {{ inventory_hostname }}"
      - "Console : https://{{ ansible_host | default(inventory_hostname) }}:{{ rsd_web_port }}/ (user {{ rsd_web_admin }})"
      - "CA      : {{ 'artifacts/' ~ inventory_hostname ~ '/rsd-ca.crt' if rsd_fetch_ca | bool else '/var/lib/rsd-master/pki/ca.crt' }}"
      - "Agents  : Enrollment tab of the console, or rsd_create_token: true"
