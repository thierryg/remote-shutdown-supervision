- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false
  when: rsd_node_exporter | bool

- name: Enable node_exporter (reachable from rsd_monitoring_server only, see the firewall)
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: rsd_node_exporter | bool

- name: Show the Prometheus scrape configuration
  ansible.builtin.debug:
    msg: >-
      scrape_configs: [{job_name: rsd-master, scheme: https, tls_config: {ca_file: rsd-ca.crt},
      authorization: {credentials_file: rsd-metrics.token},
      static_configs: [{targets: ['{{ ansible_host | default(inventory_hostname) }}:{{ rsd_web_port }}']}]}]
  when: rsd_metrics_token | default('') | length > 0
