- name: Install the dashboard command
  ansible.builtin.copy:
    src: "{{ rsd_repo_root }}/deploy/motd/rsd-motd"
    dest: /usr/local/bin/rsd-motd
    owner: root
    group: root
    mode: "0755"

- name: Create the update-motd directory
  ansible.builtin.file:
    path: /etc/update-motd.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the pam_motd hook
  ansible.builtin.copy:
    src: "{{ rsd_repo_root }}/deploy/motd/10-rsd-master"
    dest: /etc/update-motd.d/10-rsd-master
    owner: root
    group: root
    mode: "0755"
