# requirements-oldest.txt is pinned on purpose (Ubuntu 22.04 package versions): ignored.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /agent
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly}
